spring.datasource.url=jdbc:postgresql://localhost:5432/yomu_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URL be-achievement service
server.port=8080

supabase.url=${SUPABASE_URL:}
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER:}
supabase.jwt.audience=${SUPABASE_JWT_AUDIENCE:authenticated}
supabase.jwks-url=${SUPABASE_JWKS_URL:}

spring.config.import=optional:file:.env.local[.properties]

achievement.service.url=http://be-achievement:8082

auth.service.url=http://localhost:8081